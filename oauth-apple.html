<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход с помощью Apple ID</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 170 170'%3E%3Cpath fill='%23000' d='M150.37 130.25c-2.45 5.66-5.35 10.87-8.71 15.66-4.58 6.53-8.33 11.05-11.22 13.56-4.48 4.12-9.28 6.23-14.42 6.35-3.69 0-8.14-1.05-13.32-3.18-5.19-2.12-9.97-3.17-14.34-3.17-4.58 0-9.49 1.05-14.75 3.17-5.26 2.13-9.5 3.24-12.74 3.35-4.35.13-9.16-1.9-14.42-6.08-3.7-3.04-7.59-7.71-11.66-14.01-6.19-9.56-11.05-20.48-14.58-32.74-3.53-12.27-5.3-24.18-5.3-35.74 0-14.68 3.73-26.79 11.19-36.33 7.46-9.54 16.92-14.42 28.38-14.64 4.58 0 9.87 1.15 15.86 3.46 6 2.31 10.15 3.53 12.46 3.65 2.12-.12 6.35-1.39 12.69-3.82 6.34-2.43 11.62-3.53 15.86-3.3 11.75.56 21.05 4.96 27.91 13.2-10.43 6.32-15.54 15.09-15.32 26.31.22 8.79 3.53 16.2 9.94 22.23 6.41 6.03 14.15 9.49 23.23 10.37-2.07 6.33-4.53 12.72-7.38 19.17zM119.22 33.15c0-7.27 2.66-14.01 7.97-20.21 5.31-6.2 11.84-9.87 19.6-11.02.22 1.01.33 2.02.33 3.03 0 7.39-2.73 14.24-8.19 20.55-5.46 6.31-12.06 10.01-19.8 11.1-.11-1.02-.17-2.13-.17-3.45z'/%3E%3C/svg%3E">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #000000;
      color: #FFFFFF;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 32px 28px 24px;
      -webkit-font-smoothing: antialiased;
    }

    .apple-wrap {
      max-width: 420px;
      width: 100%;
      margin: 0 auto;
    }

    .apple-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .apple-logo-icon {
      margin-bottom: 16px;
      display: inline-block;
    }

    .apple-title {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.3px;
      margin-bottom: 6px;
    }

    .apple-subtitle {
      font-size: 13.5px;
      color: #8E8E93;
      line-height: 1.45;
    }

    .apple-app-name {
      color: #FFFFFF;
      font-weight: 600;
    }

    .apple-card {
      background: #1C1C1E;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .apple-account-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 16px;
    }

    .apple-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, #5856D6, #007AFF);
      color: #FFFFFF;
      font-size: 17px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .apple-account-meta {
      flex: 1;
      min-width: 0;
    }

    .apple-name-val {
      font-size: 15px;
      font-weight: 600;
      color: #FFFFFF;
    }

    .apple-email-val {
      font-size: 13px;
      color: #8E8E93;
    }

    /* Privacy Options */
    .apple-option-label {
      font-size: 11px;
      font-weight: 600;
      color: #8E8E93;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }

    .apple-radio-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 10px 0;
      cursor: pointer;
    }

    .apple-radio-input {
      margin-top: 3px;
      accent-color: #007AFF;
      width: 16px;
      height: 16px;
    }

    .apple-radio-text {
      flex: 1;
    }

    .apple-radio-title {
      font-size: 13px;
      font-weight: 600;
      color: #FFFFFF;
    }

    .apple-radio-sub {
      font-size: 11.5px;
      color: #8E8E93;
      margin-top: 2px;
      line-height: 1.35;
    }

    /* Custom Input Option */
    .apple-custom-input-box {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .apple-input {
      width: 100%;
      background: #2C2C2E;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      padding: 10px 12px;
      color: #FFFFFF;
      font-size: 13px;
      outline: none;
      margin-bottom: 10px;
    }

    .apple-input:focus {
      border-color: #007AFF;
    }

    .apple-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .apple-btn-submit {
      width: 100%;
      height: 48px;
      background: #007AFF;
      color: #FFFFFF;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s ease;
    }

    .apple-btn-submit:hover {
      background: #0062cc;
    }

    .apple-btn-cancel {
      width: 100%;
      height: 40px;
      background: transparent;
      color: #007AFF;
      border: none;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }

    .apple-btn-cancel:hover {
      text-decoration: underline;
    }

    .apple-spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #FFFFFF;
      border-radius: 50%;
      animation: spin 0.8s infinite linear;
      display: none;
    }

    .apple-btn-submit.is-loading .apple-spinner {
      display: inline-block;
    }

    .apple-btn-submit.is-loading span {
      display: none;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .apple-footer {
      text-align: center;
      font-size: 11px;
      color: #636366;
      line-height: 1.4;
      padding-top: 14px;
    }
  </style>
</head>
<body>

  <div class="apple-wrap">
    <div class="apple-header">
      <div class="apple-logo-icon">
        <svg width="48" height="48" viewBox="0 0 170 170" fill="#FFFFFF">
          <path d="M150.37 130.25c-2.45 5.66-5.35 10.87-8.71 15.66-4.58 6.53-8.33 11.05-11.22 13.56-4.48 4.12-9.28 6.23-14.42 6.35-3.69 0-8.14-1.05-13.32-3.18-5.19-2.12-9.97-3.17-14.34-3.17-4.58 0-9.49 1.05-14.75 3.17-5.26 2.13-9.5 3.24-12.74 3.35-4.35.13-9.16-1.9-14.42-6.08-3.7-3.04-7.59-7.71-11.66-14.01-6.19-9.56-11.05-20.48-14.58-32.74-3.53-12.27-5.3-24.18-5.3-35.74 0-14.68 3.73-26.79 11.19-36.33 7.46-9.54 16.92-14.42 28.38-14.64 4.58 0 9.87 1.15 15.86 3.46 6 2.31 10.15 3.53 12.46 3.65 2.12-.12 6.35-1.39 12.69-3.82 6.34-2.43 11.62-3.53 15.86-3.3 11.75.56 21.05 4.96 27.91 13.2-10.43 6.32-15.54 15.09-15.32 26.31.22 8.79 3.53 16.2 9.94 22.23 6.41 6.03 14.15 9.49 23.23 10.37-2.07 6.33-4.53 12.72-7.38 19.17zM119.22 33.15c0-7.27 2.66-14.01 7.97-20.21 5.31-6.2 11.84-9.87 19.6-11.02.22 1.01.33 2.02.33 3.03 0 7.39-2.73 14.24-8.19 20.55-5.46 6.31-12.06 10.01-19.8 11.1-.11-1.02-.17-2.13-.17-3.45z"/>
        </svg>
      </div>
      <h1 class="apple-title">Вход с помощью Apple</h1>
      <p class="apple-subtitle">Использовать Apple ID для входа в сервис <span class="apple-app-name">Amaras Tour</span></p>
    </div>

    <form class="apple-card" onsubmit="handleAppleSubmit(event)">
      <div class="apple-account-row">
        <div class="apple-avatar" id="appleAvatarIcon">AP</div>
        <div class="apple-account-meta">
          <div class="apple-name-val" id="appleNameDisplay">Пользователь Apple</div>
          <div class="apple-email-val" id="appleEmailDisplay">user@icloud.com</div>
        </div>
      </div>

      <div class="apple-option-label">Передача контактных данных</div>
      <label class="apple-radio-item">
        <input type="radio" name="email_mode" value="share" class="apple-radio-input" checked onchange="toggleCustomApple(false)">
        <div class="apple-radio-text">
          <div class="apple-radio-title">Поделиться моим email</div>
          <div class="apple-radio-sub" id="appleShareSub">Amaras Tour получит ваш личный адрес электронной почты.</div>
        </div>
      </label>

      <label class="apple-radio-item">
        <input type="radio" name="email_mode" value="hide" class="apple-radio-input" onchange="toggleCustomApple(false)">
        <div class="apple-radio-text">
          <div class="apple-radio-title">Скрыть мой email</div>
          <div class="apple-radio-sub">Apple создаст уникальный случайный адрес с пересылкой на ваш личный ящик.</div>
        </div>
      </label>

      <div class="apple-custom-input-box">
        <div style="font-size: 11px; color: #8E8E93; margin-bottom: 6px;">Использовать другой Apple ID или имя:</div>
        <input type="text" id="customAppleName" class="apple-input" placeholder="Ваше имя (необязательно)">
        <input type="email" id="customAppleEmail" class="apple-input" placeholder="email@icloud.com (необязательно)">
      </div>

      <div class="apple-actions" style="margin-top: 16px;">
        <button type="submit" class="apple-btn-submit" id="appleSubmitBtn">
          <span>Продолжить</span>
          <div class="apple-spinner"></div>
        </button>
        <button type="button" class="apple-btn-cancel" onclick="window.close()">Отмена</button>
      </div>
    </form>
  </div>

  <div class="apple-footer">
    Apple ID и политика конфиденциальности Apple защищают вашу информацию.
  </div>

  <script>
    function toggleCustomApple(isCustom) {
      // Toggle logic
    }

    function initAppleData() {
      let saved = null;
      try {
        const raw = localStorage.getItem('amaras_saved_apple');
        if (raw) saved = JSON.parse(raw);
      } catch (e) {}

      if (saved && saved.name && saved.email) {
        document.getElementById('appleNameDisplay').textContent = saved.name;
        document.getElementById('appleEmailDisplay').textContent = saved.email;
        document.getElementById('appleAvatarIcon').textContent = saved.avatarText || 'AP';
      }
    }

    function handleAppleSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('appleSubmitBtn');
      btn.classList.add('is-loading');

      const customName = document.getElementById('customAppleName').value.trim();
      const customEmail = document.getElementById('customAppleEmail').value.trim();
      const mode = document.querySelector('input[name="email_mode"]:checked').value;

      let name = customName || document.getElementById('appleNameDisplay').textContent || 'Пользователь Apple';
      let email = customEmail || document.getElementById('appleEmailDisplay').textContent || 'user@icloud.com';

      if (mode === 'hide' && !customEmail) {
        email = 'privaterelay_' + Math.random().toString(36).substring(2, 8) + '@privaterelay.appleid.com';
      }

      try {
        localStorage.setItem('amaras_saved_apple', JSON.stringify({
          name: name,
          email: email,
          avatarText: 'AP'
        }));
      } catch (err) {}

      setTimeout(() => {
        if (window.opener && !window.opener.closed) {
          window.opener.postMessage({
            type: 'amaras:oauth_success',
            provider: 'apple',
            name: name,
            email: email
          }, '*');
          window.close();
        } else {
          window.location.href = 'index.html?oauth=apple&name=' + encodeURIComponent(name) + '&email=' + encodeURIComponent(email);
        }
      }, 450);
    }

    document.addEventListener('DOMContentLoaded', initAppleData);
  </script>
</body>
</html>
