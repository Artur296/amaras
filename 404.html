<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Amaras Tour</title>
  <link rel="icon" href="assets/favicon.svg?v=2" type="image/svg+xml" />
  <script>
    (function () {
      var path = window.location.pathname;
      if (/\/admin\/?$/i.test(path)) {
        var base = path.replace(/\/admin\/?$/i, '');
        window.location.replace((base || '') + '/admin.html' + window.location.search + window.location.hash);
        return;
      }
      var parts = path.split('/').filter(Boolean);
      var last = parts[parts.length - 1] || '';
      if (last && !last.includes('.')) {
        parts[parts.length - 1] = last + '.html';
        window.location.replace('/' + parts.join('/') + window.location.search + window.location.hash);
      }
    })();
  </script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #1C1A1A;
      color: #ECE8E1;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .error-card {
      background: #201F1F;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 40px;
      max-width: 480px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    .error-code {
      font-size: 56px;
      font-weight: 800;
      color: #C7FF32;
      line-height: 1;
      margin-bottom: 16px;
    }
    .error-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .error-desc {
      font-size: 14px;
      color: #999;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .error-btn {
      display: inline-block;
      padding: 12px 24px;
      background: #586EFF;
      color: #fff;
      text-decoration: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
      transition: background 0.2s ease;
    }
    .error-btn:hover {
      background: #4659db;
    }
  </style>
</head>
<body>
  <div class="error-card">
    <div class="error-code">404</div>
    <div class="error-title">Страница не найдена</div>
    <div class="error-desc">Возможно, указан неверный адрес или страница была перемещена.</div>
    <a href="index.html" class="error-btn">Вернуться на главную</a>
  </div>
</body>
</html>
